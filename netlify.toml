# Repository connection is authorised. Website publication is NOT authorised.
# Exit 0 skips Netlify builds. Do not remove without explicit release approval.
[build]
  command = "npm run build:production"
  publish = "dist"
  ignore = "exit 0"

[build.environment]
  NODE_VERSION = "22"

[context.deploy-preview]
  command = "npm run build:production"

[[redirects]]
  from = "/projects/hold-east-office"
  to = "/projects/holder-east-office/"
  status = 301

[[redirects]]
  from = "/projects/hold-east-office/"
  to = "/projects/holder-east-office/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
